services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cardapio
      POSTGRES_USER: cardapio
      POSTGRES_PASSWORD: cardapio
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardapio -d cardapio"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - cardapio-db:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://database:5432/cardapio
      DB_USERNAME: cardapio
      DB_PASSWORD: cardapio
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    environment:
      API_HOST: backend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  cardapio-db:
